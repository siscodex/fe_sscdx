name: Deploy a GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check y build
        run: npm run build
        env:
          # TEMPORAL: mientras se prueba en siscodex.github.io/fe_sscdx (sin
          # dominio propio todavía). Cuando el DNS de siscodex.com ya apunte a
          # GitHub Pages y el dominio quede verificado en Settings → Pages,
          # volver a "/" (ver public/CNAME) — si no, el sitio en el dominio
          # real quedará sin estilos por el mismo motivo que este cambio arregla.
          PUBLIC_BASE_PATH: /fe_sscdx

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
